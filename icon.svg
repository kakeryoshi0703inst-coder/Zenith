<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Luxury Matte Black to Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Subtle Vignette / Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Platinum/White Architectural Highlights -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#D4D4D8"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Bank Building Motif (Classic Neoclassical Banking Architecture) -->
  <g filter="url(#subtleShadow)">
    
    <!-- Pediment (Roof Triangular Gable) -->
    <polygon points="256,92 108,172 404,172" fill="#FFFFFF"/>
    <!-- Pediment Inner Relief Arch / Emblem -->
    <polygon points="256,118 140,166 372,166" fill="#18181B"/>
    <circle cx="256" cy="148" r="10" fill="#FFFFFF"/>

    <!-- Entablature / Architrave / Frieze -->
    <rect x="100" y="176" width="312" height="18" rx="3" fill="#F4F4F5"/>
    <rect x="116" y="198" width="280" height="12" rx="2" fill="#E4E4E7"/>

    <!-- Neoclassical Bank Pillars / Columns (4 Grand Columns) -->
    <!-- Column 1 -->
    <rect x="132" y="214" width="28" height="128" rx="4" fill="url(#pillarGrad)"/>
    <!-- Capital & Base 1 -->
    <rect x="126" y="212" width="40" height="8" rx="2" fill="#FFFFFF"/>
    <rect x="126" y="338" width="40" height="8" rx="2" fill="#FFFFFF"/>

    <!-- Column 2 -->
    <rect x="204" y="214" width="28" height="128" rx="4" fill="url(#pillarGrad)"/>
    <!-- Capital & Base 2 -->
    <rect x="198" y="212" width="40" height="8" rx="2" fill="#FFFFFF"/>
    <rect x="198" y="338" width="40" height="8" rx="2" fill="#FFFFFF"/>

    <!-- Column 3 -->
    <rect x="276" y="214" width="28" height="128" rx="4" fill="url(#pillarGrad)"/>
    <!-- Capital & Base 3 -->
    <rect x="270" y="212" width="40" height="8" rx="2" fill="#FFFFFF"/>
    <rect x="270" y="338" width="40" height="8" rx="2" fill="#FFFFFF"/>

    <!-- Column 4 -->
    <rect x="348" y="214" width="28" height="128" rx="4" fill="url(#pillarGrad)"/>
    <!-- Capital & Base 4 -->
    <rect x="342" y="212" width="40" height="8" rx="2" fill="#FFFFFF"/>
    <rect x="342" y="338" width="40" height="8" rx="2" fill="#FFFFFF"/>

    <!-- Bank Podium / Steps (Stereobate & Stylobate) -->
    <rect x="108" y="350" width="296" height="12" rx="2" fill="#E4E4E7"/>
    <rect x="94" y="364" width="324" height="14" rx="3" fill="#D4D4D8"/>
    <rect x="80" y="380" width="352" height="16" rx="4" fill="#FFFFFF"/>

    <!-- Bank Vault / Central Entrance Silhouette behind pillars -->
    <path d="M 238 290 A 18 18 0 0 1 274 290 L 274 348 L 238 348 Z" fill="#27272A"/>

  </g>

  <!-- Typography: ZENITH -->
  <text x="256" y="442" 
        font-family="'Outfit', 'Inter', 'Cinzel', -apple-system, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="9" 
        text-anchor="middle" 
        fill="#FFFFFF">ZENITH</text>
  
  <text x="256" y="466" 
        font-family="'Inter', sans-serif" 
        font-size="10.5" 
        font-weight="600" 
        letter-spacing="4.5" 
        text-anchor="middle" 
        fill="#A1A1AA">MONEY</text>
</svg>
